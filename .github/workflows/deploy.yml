name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    # This PR deploys only to whisk-demo preview. whisk Pages preview shares prod KV.
    if: github.event_name != 'pull_request' || github.head_ref != 'cursor/kitchn-one-tap-92c0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run build

      # Create preview-only KV/R2 and inject wrangler.toml [env.preview]
      # so this deploy does not re-bind preview to production storage.
      # Skipped on main — production bindings stay as the top-level wrangler.toml IDs.
      - name: Provision isolated preview storage
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'whisk' }}
          PREVIEW_APP_SECRET: ${{ secrets.PREVIEW_APP_SECRET }}
          PHASE: pre-deploy
        run: bash scripts/isolate-preview-storage.sh

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.0"
          command: pages deploy dist --project-name ${{ vars.CLOUDFLARE_PROJECT_NAME || 'whisk' }} --branch ${{ github.head_ref || 'main' }} --commit-dirty=true

      - name: Bind preview-only secret and verify isolation
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'whisk' }}
          PREVIEW_APP_SECRET: ${{ secrets.PREVIEW_APP_SECRET }}
          PHASE: post-deploy
        run: bash scripts/isolate-preview-storage.sh

      - name: Upload preview binding IDs
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v7
        with:
          name: preview-bindings
          path: |
            .isolate-preview/production-snapshot.json
            .isolate-preview/preview-bindings.json
            .isolate-preview/wrangler-preview-snippet.toml
            .isolate-preview/preview-env-set.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload preview login (1 day)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: preview-test-login
          path: .isolate-preview/preview-secret.txt
          if-no-files-found: ignore
          retention-days: 1
